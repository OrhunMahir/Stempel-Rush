<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2433" />
  <title>Stempel Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Join -->
  <div id="join" class="screen">
    <div class="card">
      <div class="badge">Ausländerbehörde München</div>
      <h1>STEMPEL<br />RUSH</h1>
      <p class="sub">5 Stempel. 1 Aufenthaltstitel. Die Behörde schließt gleich.</p>
      <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="off" />
      <button id="joinBtn" class="big">Nummer ziehen &amp; rein</button>
      <button id="soloBtn" class="ghost">Allein üben</button>
      <p class="help">WASD / Pfeile · Handy: links wischen</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="stamps"></div>
    <div id="timer">2:30</div>
    <div id="info"></div>
  </div>
  <div id="bubble" class="hidden"><span class="who">👔</span><span id="bubbleText"></span></div>
  <div id="center"></div>
  <div id="progress" class="hidden"><div id="progressFill"></div><span id="progressText">Formular ausfüllen…</span></div>

  <!-- Lobby -->
  <div id="lobby" class="hidden">
    <div id="lobbyMain">
      <div class="lobbyTitle">Wartebereich</div>
      <div id="playerList"></div>
      <button id="startBtn" class="big">Behörde öffnen ▶</button>
    </div>
    <div id="qrBox">
      <canvas id="qr"></canvas>
      <div id="joinUrl"></div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="hidden">
    <div class="card">
      <h2 id="resultsTitle">Ergebnis</h2>
      <ol id="resultList"></ol>
      <div id="resultsNext"></div>
    </div>
  </div>

  <div id="joy" class="hidden"><div id="joyNub"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
